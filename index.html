<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <title>Naumaan Kalyani — Full-stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Naumaan Kalyani — full-stack developer building fast, animated web experiences with React, Laravel and Three.js."
    />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naumaan Kalyani — Full-stack Developer" />
    <meta
      property="og:description"
      content="Fast, animated and accessible web experiences — React, Laravel, GSAP & Three.js."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naumaan Kalyani — Full-stack Developer" />
    <meta
      name="twitter:description"
      content="Fast, animated and accessible web experiences — React, Laravel, GSAP & Three.js."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Naumaan Kalyani",
        "jobTitle": "Full-stack Developer",
        "knowsAbout": ["React", "Laravel", "PHP", "MySQL", "Three.js", "GSAP", "Docker"]
      }
    </script>

    <!-- Fonts: preconnect + NON-render-blocking stylesheet (the preloader
         covers the brief fallback-font swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Static first frame of the preloader: paints before any JS runs, then
         React's <Preloader /> (identical markup) takes over seamlessly. -->
    <div id="root">
      <div class="preloader" aria-hidden="true">
        <div class="preloader__panel">
          <div class="preloader__top">
            <span class="preloader__brand">nk<sup>®</sup></span>
          </div>
          <div class="preloader__center"></div>
          <div class="preloader__bottom">
            <span class="preloader__bar"><span class="preloader__fill"></span></span>
            <span class="preloader__mask"
              ><span class="preloader__count"
                ><span class="preloader__num">0</span><span class="preloader__pct">%</span></span
              ></span
            >
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
